    <style>

        /* =====================================================
           GLOBAL
        ====================================================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            color: #212529;

            transition:
                background-color 0.3s ease,
                color 0.3s ease;
        }


        /* =====================================================
           STOREHUB TOP HEADER
        ====================================================== */

        .storehub-header {

            width: 100%;

            min-height: 95px;

            background: #071027;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            padding: 15px 30px;

            z-index: 1000;
        }


        /* =====================================================
           STOREHUB BRAND
        ====================================================== */

        .storehub-brand {

            display: flex;

            align-items: center;

            gap: 10px;

            text-decoration: none;

            color: #ffffff;

            font-size: 34px;

            font-weight: 800;

            letter-spacing: -1px;

            transition: 0.3s ease;
        }


        .storehub-brand:hover {

        }


        /* =====================================================
           LOGO
        ====================================================== */

        .storehub-logo {

            height: 58px;

           BRAND NAME
        ====================================================== */

        .storehub-name {

        /* =====================================================
           HEADER CONTROLS
        ====================================================== */

        .storehub-controls {

            position: absolute;

            right: 30px;

            top: 50%;

            transform: translateY(-50%);

            display: flex;

            align-items: center;

            gap: 10px;
        }


        /* =====================================================
           CONTROL BUTTON
        ====================================================== */

        .storehub-control {

            border: none;

            height: 48px;

            min-width: 48px;

            padding: 0 15px;

            border-radius: 25px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            cursor: pointer;

            font-family: inherit;

            font-weight: 600;

            transition: all 0.3s ease;
        }


        /* =====================================================
           DARK MODE BUTTON
        ====================================================== */

        #themeToggle {

            width: 52px;

            height: 52px;

            padding: 0;

            border-radius: 50%;

            background: #ffc107;

            color: #000;

            font-size: 20px;
        }


        #themeToggle:hover {

            transform: scale(1.08);

            background: #ffca2c;

        }


        /* =====================================================
           RTL BUTTON
        ====================================================== */

        #rtlToggle {

            background: #1c2738;

            color: #ffffff;

            border: 1px solid rgba(255,255,255,0.15);

            font-size: 14px;
        }


        #rtlToggle:hover {

            background: #ffc107;

            color: #000;

            border-color: #ffc107;

        }


        /* =====================================================
           LOGIN SECTION
        ====================================================== */

        .login-section {

            min-height: calc(100vh - 95px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 70px 15px;
        }


        /* =====================================================
           LOGIN CARD
        ====================================================== */

        .login-card {

            width: 100%;

            max-width: 450px;

            background: #fff;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.08);

            transition:
                background-color 0.3s ease,
                color 0.3s ease,
                box-shadow 0.3s ease;

           LOGIN ICON
        ====================================================== */

           RTL
        ====================================================== */

        html[dir="rtl"] body {

        }


        html[dir="rtl"] .login-card {

    <!-- =====================================================

    ====================================================== -->

    <section class="login-section">

        <div class="login-card">


            <!-- ICON -->

            <div class="login-icon">

                <i class="fa-solid fa-right-to-bracket"></i>

            </div>


            <!-- TITLE -->

            <h2 class="text-center fw-bold mb-2">

                Welcome Back

            </h2>


            <p class="text-center text-muted mb-4">

                Login to your StoreHub account

            </p>


            <!-- FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label fw-semibold">

                        Email Address

                    </label>


                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>

                </div>



                <!-- PASSWORD -->

                    <label
                        for="password"
                        class="form-label fw-semibold">

                        Password

                    </label>


                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>

                </div>

                <div
                    class="d-flex justify-content-between align-items-center mb-4">


                    <div class="form-check">

                        <input

                            type="checkbox"

                        <label
                            class="form-check-label"
                            for="remember">

                    </div>

                    </a>

    <!-- =====================================================
         BOOTSTRAP JS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <!-- =====================================================
         DARK MODE + RTL
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                /* =================================================
                   DARK MODE
                ================================================== */

                const themeToggle =
                    document.getElementById(
                        "themeToggle"
                    );


                const savedTheme =
                    localStorage.getItem(
                        "theme"
                    );


                /* Load saved theme */

                if (savedTheme === "dark") {

                    document.body.classList.add(
                        "dark-mode"
                    );

                    if (themeToggle) {

                        themeToggle.innerHTML =
                            "☀️";

                    }

                }


                else {

                    if (themeToggle) {

                        themeToggle.innerHTML =
                            "🌙";

                    }

                }


                /* Toggle dark mode */

                if (themeToggle) {

                    themeToggle.addEventListener(
                        "click",
                        function () {


                            document.body.classList.toggle(
                                "dark-mode"
                            );


                            if (
                                document.body.classList.contains(
                                    "dark-mode"
                                )
                            ) {


                                localStorage.setItem(
                                    "theme",
                                    "dark"
                                );


                                themeToggle.innerHTML =
                                    "☀️";

                            }

                            else {


                                localStorage.setItem(
                                    "theme",
                                    "light"
                                );


                                themeToggle.innerHTML =
                                    "🌙";

                            }

                        }
                    );

                }



                /* =================================================
                   RTL / LTR
                ================================================== */

                const rtlToggle =
                    document.getElementById(
                        "rtlToggle"
                    );


                const savedDirection =
                    localStorage.getItem(
                        "direction"
                    );


                /* Load saved direction */

                if (savedDirection === "rtl") {


                    document.documentElement
                        .setAttribute(
                            "dir",
                            "rtl"
                        );


                    if (rtlToggle) {

                        rtlToggle.innerHTML =
                            "⇄ <span>LTR</span>";

                    }

                }

                else {


                    document.documentElement
                        .setAttribute(
                            "dir",
                            "ltr"
                        );


                    if (rtlToggle) {

                        rtlToggle.innerHTML =
                            "⇄ <span>RTL</span>";

                    }

                }



                /* Toggle RTL */

                if (rtlToggle) {

                    rtlToggle.addEventListener(
                        "click",
                        function () {


                            const currentDirection =
                                document.documentElement
                                    .getAttribute(
                                        "dir"
                                    );


                            if (
                                currentDirection ===
                                "rtl"
                            ) {


                                document.documentElement
                                    .setAttribute(
                                        "dir",
                                        "ltr"
                                    );


                                localStorage.setItem(
                                    "direction",
                                    "ltr"
                                );


                                rtlToggle.innerHTML =
                                    "⇄ <span>RTL</span>";

                            }

                            else {


                                document.documentElement
                                    .setAttribute(
                                        "dir",
                                        "rtl"
                                    );


                                localStorage.setItem(
                                    "direction",
                                    "rtl"
                                );


                                rtlToggle.innerHTML =
                                    "⇄ <span>LTR</span>";

                            }

                        }
                    );

                }

            }
            
        );

    </script>
